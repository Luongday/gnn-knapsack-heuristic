dataset:
  train_dir: "../../../data/cross_scale/train_small"
  val_dir: "../../../data/cross_scale/val_small"
  test_dir: "../../../data/cross_scale/test_small"
  train_ratio: 0.8
  val_ratio: 0.1

model:
  hidden_dim: 128

rl:
  gamma: 0.99
  lr: 0.0002
  batch_size: 256
  buffer_size: 200000
  min_buffer_size: 10000
  target_update_steps: 4000
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 40000
  grad_clip_norm: 5.0
  train_steps: 60000
  warmup_steps: 2000
  target_tau: 0.005

seed: 2025

device: "auto"  # auto, cpu, cuda

paths:
  out_dir: "../../../results/DQN"
